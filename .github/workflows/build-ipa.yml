name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project TDSCarKit.xcodeproj \
            -scheme TDSCarKit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log

      - name: Sign TrollStore entitlements
        run: |
          brew install ldid
          APP="build/Build/Products/Release-iphoneos/TDSCarKit.app"
          ldid -Sdocs/support/TrollStore.entitlements "$APP/TDSCarKit"
          find "$APP" -type f \( -name "*.dylib" -o -path "*/Frameworks/*" \) -print0 |
            xargs -0 -I{} ldid -Sdocs/support/TrollStore.entitlements "{}" || true
          ldid -e "$APP/TDSCarKit" | head -40

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/TDSCarKit.app" Payload/
          zip -qry CarWithin-1.0.5-ios15-unsigned.ipa Payload
          shasum -a 256 CarWithin-1.0.5-ios15-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CarWithin-unsigned-ipa
          path: CarWithin-1.0.5-ios15-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log